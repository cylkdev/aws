name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # `AWS.HTTP` is written against a specific Req contract -- Req 0.7 changed
      # both verb inference and the Finch pool option shape. An unlocked resolve
      # is what let that break reach consumers, so fail loudly if `mix.lock` and
      # `mix.exs` have drifted apart rather than silently resolving something new.
      - name: Check mix.lock is in sync with mix.exs
        run: mix deps.get --check-locked

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - run: mix test
